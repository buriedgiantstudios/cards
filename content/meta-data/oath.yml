id: oath
name: Oath

filters:
  - name: Defense
    prop: defense
    type: number

  - name: Card Capacity
    prop: cardcapacity
    type: number
  
  - name: Zeal
    prop: zeal
    type: number

subproducts:
  - name: Oath Base Game
    id: oathbasegame
    desc: >
      Guide the course of history in an ancient land. The consequences of one game will ripple through those that follow.

  - name: Denizen Deck
    id: denizen-deck
    desc: >
      Add sixty new denizen cards that you can use with either the base game of Oath or New Foundations.

  - name: New Foundations
    id: oath-newfoundations
    desc: >
      A dramatic new expansion for the award-winning game Oath: Chronicles of Empire and Exile. This expansion has been designed to make Oath more approachable for new players and to give players more control over how their chronicles grow and change.
      
      Includes dozens of revised and improved denizens, six times as many edifices, twice as many relics, two new player colors, and a set of wooden bandits.

  - name: Clockwork Adversaries
    id: oath-clockwork
    desc: >
      Oath: Clockwork Adversaries and the Queen of Shadows is an expansion that introduces new modes of solo and cooperative play to the world of Oath. 

      It can also be used to spice up multiplayer game nights. This expansion is compatible with both the base game and with Oath: New Foundations.

external:
  rules: https://rules.buriedgiant.com/?product=oathnf

# https://handlebarsjs.com/guide/
cardTemplate:
  en-US: >
    {{#if meta.cardcapacity }}
      <div>
        <p>Card Capacity: {{ meta.cardcapacity }}
      </div>
    {{/if}}

    {{#if meta.defense }}
      <div>
        <p>Defense: {{ meta.defense }}
      </div>
    {{/if}}

    {{#if meta.zeal }}
      <div>
        <p>Zeal: {{ meta.zeal }}
      </div>
    {{/if}}
