  text: >-
    Search `symbol:action-search` the world deck if the Servant is an Exile and
    either has no Vision or fewer than 3 Visions have been drawn.

    Otherwise, roll the end die: **1–4:** Gain `symbol:favor` as in Gain Favor.
    **5–6:** Gain `symbol:secret`.
  image: Clockwork A02
  name: Action A02
  flipSide: OATH-CW-A02b
  tags:
