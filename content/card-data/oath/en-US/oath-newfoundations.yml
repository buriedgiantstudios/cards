    - Legacy
- id: OATH-L19-NF
  text: >-
    **Action**: You may peek at the relics at **any** site. _You may peek at
    them later at any time._ **Chronicle (Throne)**: In Scatter Relics, you
    examine the relics and choose which sites they go to.
  image: The Ear (NF)
  imageClass: rotated
  name: The Ear
  tags:
    - New Foundations
    - Legacy
- id: OATH-L20-NF
  text: >-
    **Chronicle (Throne)**: Before Scatter Relics, secretly choose one of your
    relics to keep facedown. You will start the next game with it.
  image: Heirloom (NF)
  imageClass: rotated
  name: Heirloom
  tags:
