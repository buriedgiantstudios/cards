  meta:
    cardcapacity: 0
    defense: 2
  name: Sunken Isles
  tags:
    - New Foundations
    - Site
    - Travel
  text: >-
    **Island.** This site has the Coast power (see below). Traveling to it costs 2 Supply
    more than its normal Travel cost unless you're traveling from a Coast or
    Island. _Also, the Sunken Isles site has no capacity, so it cannot usually
    be targeted in a Campaign._ 
    
    **Coast.** Traveling from here to a Coast or
    Island costs only 1 Supply and ignores other Travel modifiers _(Mountain,
    Pass, etc.)_.
  image: Sunken Isles (NF)
  imageClass: rotated
- id: OATH-S03-NF
  meta:
    cardcapacity: 2
